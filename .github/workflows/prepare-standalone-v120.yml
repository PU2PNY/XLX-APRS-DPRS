name: Prepare standalone APRS-DPRS v1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-standalone-v120.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generalize standalone module and validate
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # install.sh: make reflector module, DExtra port and client module configurable.
          p = Path('install.sh')
          s = p.read_text(encoding='utf-8')
          s = s.replace('REFLECTOR_HOST="127.0.0.1"\nCLIENT_CALLSIGN=""', 'REFLECTOR_HOST="127.0.0.1"\nREFLECTOR_MODULE="B"\nDEXTRA_PORT="30001"\nCLIENT_MODULE="G"\nCLIENT_CALLSIGN=""')
          s = s.replace('  --reflector-name NOME      Ex.: XLX026\n  --reflector-host HOST      IP/host do XLXD; padrao 127.0.0.1\n  --client-callsign CALL     Indicativo do cliente DExtra', '  --reflector-name NOME      Ex.: XLX123\n  --reflector-host HOST      IP/host do XLXD; padrao 127.0.0.1\n  --reflector-module LETRA   Modulo XLX monitorado; padrao B\n  --dextra-port PORTA        Porta DExtra do XLXD; padrao 30001\n  --client-module LETRA      Modulo do cliente DExtra; padrao G\n  --client-callsign CALL     Indicativo do cliente DExtra')
          s = s.replace('        --reflector-host) REFLECTOR_HOST="${2:-}"; shift 2 ;;\n        --client-callsign)', '        --reflector-host) REFLECTOR_HOST="${2:-}"; shift 2 ;;\n        --reflector-module) REFLECTOR_MODULE="${2:-}"; shift 2 ;;\n        --dextra-port) DEXTRA_PORT="${2:-}"; shift 2 ;;\n        --client-module) CLIENT_MODULE="${2:-}"; shift 2 ;;\n        --client-callsign)')

          old_legacy = '''# Não permite instalar o novo serviço ao lado do legado ativo: dois gateways no módulo B
# poderiam duplicar conexões/atividade APRS.
if systemctl is-active --quiet xlx026-digital-lab.service 2>/dev/null; then
    fail "Servico legado xlx026-digital-lab esta ativo. Use um procedimento de migracao dedicado; este instalador nao executa coexistencia."
fi
'''
          new_legacy = '''# Não permite instalar ao lado de um Digital Lab legado ativo. A detecção é
# genérica para evitar amarrar o instalador a um refletor específico.
LEGACY_SERVICE="$(systemctl list-units --type=service --state=active --no-legend --no-pager 2>/dev/null \\
    | awk '{print $1}' \\
    | grep -Ei '(^|-)digital-lab\\.service$' \\
    | grep -v '^xlx-aprs-dprs\\.service$' \\
    | head -n1 || true)"
if [ -n "$LEGACY_SERVICE" ]; then
    fail "Servico Digital Lab legado ativo: $LEGACY_SERVICE. Use migracao controlada; coexistencia nao e permitida."
fi
'''
          if old_legacy not in s:
              raise SystemExit('legacy service block not found')
          s = s.replace(old_legacy, new_legacy)

          s = s.replace('REFLECTOR_NAME="$(printf \'%s\' "$REFLECTOR_NAME" | tr \'[:lower:]\' \'[:upper:]\' | tr -cd \'A-Z0-9_-\')"\nCLIENT_CALLSIGN=', 'REFLECTOR_NAME="$(printf \'%s\' "$REFLECTOR_NAME" | tr \'[:lower:]\' \'[:upper:]\' | tr -cd \'A-Z0-9_-\')"\nREFLECTOR_MODULE="$(printf \'%s\' "$REFLECTOR_MODULE" | tr \'[:lower:]\' \'[:upper:]\' | tr -cd \'A-Z\' | cut -c1)"\nCLIENT_MODULE="$(printf \'%s\' "$CLIENT_MODULE" | tr \'[:lower:]\' \'[:upper:]\' | tr -cd \'A-Z\' | cut -c1)"\nCLIENT_CALLSIGN=')
          s = s.replace('[ -n "$REFLECTOR_NAME" ] || fail "Nome do refletor invalido."\n', '[ -n "$REFLECTOR_NAME" ] || fail "Nome do refletor invalido."\n[[ "$REFLECTOR_MODULE" =~ ^[A-Z]$ ]] || fail "Modulo do refletor invalido; use uma letra A-Z."\n[[ "$CLIENT_MODULE" =~ ^[A-Z]$ ]] || fail "Modulo do cliente DExtra invalido; use uma letra A-Z."\n[[ "$DEXTRA_PORT" =~ ^[0-9]+$ ]] || fail "Porta DExtra invalida."\n[ "$DEXTRA_PORT" -ge 1 ] && [ "$DEXTRA_PORT" -le 65535 ] || fail "Porta DExtra fora do intervalo 1-65535."\n')
          s = s.replace('echo "Host XLXD       : $REFLECTOR_HOST"\necho "Cliente DExtra', 'echo "Host XLXD       : $REFLECTOR_HOST"\necho "Modulo XLX      : $REFLECTOR_MODULE"\necho "Porta DExtra    : $DEXTRA_PORT"\necho "Modulo cliente  : $CLIENT_MODULE"\necho "Cliente DExtra')
          s = s.replace('    "$REFLECTOR_HOST" \\\n    "$CLIENT_CALLSIGN"', '    "$REFLECTOR_HOST" \\\n    "$REFLECTOR_MODULE" \\\n    "$DEXTRA_PORT" \\\n    "$CLIENT_MODULE" \\\n    "$CLIENT_CALLSIGN"')
          s = s.replace('out, name, host, client, aprs, tx = sys.argv[1:]\ntx = tx == "1"', 'out, name, host, module, dextra_port, client_module, client, aprs, tx = sys.argv[1:]\ntx = tx == "1"\ndextra_port = int(dextra_port)')
          s = s.replace('        "port": 30001,\n        "module": "B",\n        "client_callsign": client,\n        "client_module": "G"', '        "port": dextra_port,\n        "module": module,\n        "client_callsign": client,\n        "client_module": client_module')
          s = s.replace('        "module": "B"\n    }\n}', '        "module": module\n    }\n}')
          p.write_text(s, encoding='utf-8')

          # Gateway: keep behavior but remove module-B-specific naming.
          p = Path('gateway/xlx_aprs_dprs.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Read-only DExtra client for XLX module B + APRS-IS command service.', 'Read-only DExtra client for a configured XLX module + APRS-IS command service.')
          s = s.replace('VERSION = "1.1.1"', 'VERSION = "1.2.0"')
          s = s.replace('super().__init__(name="dextra-b")', 'super().__init__(name="dextra-module")')
          s = s.replace('self.db.set_status("module_b",', 'self.db.set_status("dextra_module",')
          s = s.replace('"DPRS_MODULE_B"', '"DPRS_MODULE"')
          p.write_text(s, encoding='utf-8')

          # Web code consumes the status key published by the gateway.
          for name in ['web/assets/digital-lab.js','web/assets/digital-lab-operator.js','web/digital-lab-native.php','web/api/digital-lab.php','web/api/digital-lab-operator.php']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('module_b', 'dextra_module').replace('DPRS_MODULE_B', 'DPRS_MODULE')
              p.write_text(s, encoding='utf-8')

          # Generic architecture / service notes.
          p = Path('systemd/xlx-aprs-dprs.service')
          s = p.read_text(encoding='utf-8').replace('These controls are proven on the XLX026 workload.', 'These controls are conservative defaults for an XLX reflector workload.')
          p.write_text(s, encoding='utf-8')

          p = Path('docs/ARCHITECTURE.md')
          s = p.read_text(encoding='utf-8').replace('XLXD módulo B', 'XLXD módulo configurado')
          p.write_text(s, encoding='utf-8')

          # README: standalone/public contract and new options.
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Módulo opcional APRS / D-PRS para instalações XLX com o painel moderno.', 'Componente independente APRS / D-PRS para refletores XLX e para o XLX Modern Dashboard.')
          s = s.replace('Este repositório mantém o gateway de dados separado do core do XLXD.', 'Este é o repositório oficial e exclusivo do componente APRS/D-PRS. Ele mantém o gateway de dados separado do core do XLXD e separado do repositório do dashboard.')
          s = s.replace('Exemplo com leitura do módulo B, APRS-IS e TX APRS:', 'Exemplo com leitura do módulo C, APRS-IS e TX APRS:')
          s = s.replace('  --reflector-host 127.0.0.1 \\\n  --client-callsign', '  --reflector-host 127.0.0.1 \\\n  --reflector-module C \\\n  --dextra-port 30001 \\\n  --client-module G \\\n  --client-callsign')
          s = s.replace('## Migração de instalações antigas\n\nO instalador aborta se detectar o serviço legado `xlx026-digital-lab.service` ativo.\n\nIsso é intencional: executar dois gateways em paralelo no mesmo módulo pode duplicar conexões e atividade APRS.\n', '## Migração de instalações antigas\n\nO instalador procura genericamente por um serviço legado `*-digital-lab.service` ativo e aborta antes de instalar.\n\nIsso é intencional: executar dois gateways em paralelo no mesmo módulo pode duplicar conexões e atividade APRS.\n')
          insert = '''\n## Parâmetros do módulo XLX\n\nOs valores padrão continuam compatíveis com a instalação tradicional:\n\n```text\nreflector module: B\nDExtra port:      30001\nclient module:    G\n```\n\nEles podem ser alterados sem editar código usando `--reflector-module`, `--dextra-port` e `--client-module`.\n\n## Integração com o XLX Modern Dashboard\n\nO código APRS/D-PRS não deve ser copiado para o repositório do dashboard. O instalador deste repositório publica a interface em `<dashboard>/aprs-dprs/`. O dashboard apenas pode apontar para essa rota quando o componente estiver instalado.\n'''
          marker = '\n## Conta administrativa inicial\n'
          if insert.strip() not in s:
              s = s.replace(marker, insert + marker)
          p.write_text(s, encoding='utf-8')

          p = Path('CHANGELOG.md')
          old = p.read_text(encoding='utf-8')
          entry = '''# Changelog\n\n## 1.2.0 — 2026-09-01\n\n- consolida `XLX-APRS-DPRS` como repositório exclusivo e independente do APRS/D-PRS;\n- remove referências operacionais específicas de um refletor;\n- torna módulo XLX, porta DExtra e módulo do cliente configuráveis pelo instalador;\n- mantém B / 30001 / G como padrões compatíveis;\n- generaliza a detecção de Digital Lab legado para impedir gateways duplicados;\n- mantém o código APRS/D-PRS fora do repositório do dashboard e publica somente em `<dashboard>/aprs-dprs/`;\n- atualiza gateway e interface para usar a chave genérica `dextra_module`.\n\n'''
          if old.startswith('# Changelog\n'):
              old = old[len('# Changelog\n\n'):]
          p.write_text(entry + old, encoding='utf-8')

          Path('VERSION').write_text('1.2.0\n', encoding='utf-8')
          PY

          # Generic example remains explicit about defaults.
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/config.example.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['reflector']['port']=30001
          d['reflector']['module']='B'
          d['reflector']['client_module']='G'
          d['site']['module']='B'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

          # Public-source audit: no production identity or runtime secrets.
          ! grep -RniE --binary-files=without-match --exclude-dir=.git --exclude-dir=.github \
            '(XLX026|XRF026|xlx026\.net|Santa[[:space:]]+Isabel|BEGIN[[:space:]]+(RSA|OPENSSH|EC)[[:space:]]+PRIVATE[[:space:]]+KEY|github_pat_|ghp_[A-Za-z0-9]{20,})' .

          # Rebuild manifest using the existing tracked source-file list.
          mapfile -t manifest_files < <(awk '{sub(/^[0-9a-f]{64}  /, ""); print}' SOURCE-MANIFEST.sha256)
          : > SOURCE-MANIFEST.sha256.new
          for f in "${manifest_files[@]}"; do
            test -f "$f" || { echo "Manifest file missing: $f" >&2; exit 1; }
            sha256sum "$f" >> SOURCE-MANIFEST.sha256.new
          done
          mv SOURCE-MANIFEST.sha256.new SOURCE-MANIFEST.sha256

          sha256sum -c SOURCE-MANIFEST.sha256
          bash -n install.sh
          bash -n update.sh
          bash -n backup.sh
          bash -n uninstall.sh
          bash -n scripts/validate-source.sh
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find web scripts -type f -name '*.php' -print0)
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find web/assets -type f -name '*.js' -print0)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gateway/xlx_aprs_dprs.py')
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY
          python3 gateway/xlx_aprs_dprs.py --config config/config.example.json --check-config
          bash scripts/validate-source.sh

          git config user.name 'PU2PNY'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add README.md CHANGELOG.md VERSION SOURCE-MANIFEST.sha256 install.sh config/config.example.json docs/ARCHITECTURE.md gateway/xlx_aprs_dprs.py systemd/xlx-aprs-dprs.service web
          git commit -m 'feat: make APRS-DPRS fully standalone and reflector-generic'
          git push origin HEAD:main
