name: Prepare standalone APRS-DPRS v1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-standalone-v120.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare and validate v1.2.0
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/prepare-v120.py

          mapfile -t manifest_files < <(awk '{sub(/^[0-9a-f]{64}  /, ""); print}' SOURCE-MANIFEST.sha256)
          : > SOURCE-MANIFEST.sha256.new
          for f in "${manifest_files[@]}"; do
            test -f "$f" || { echo "Manifest file missing: $f" >&2; exit 1; }
            sha256sum "$f" >> SOURCE-MANIFEST.sha256.new
          done
          mv SOURCE-MANIFEST.sha256.new SOURCE-MANIFEST.sha256

          sha256sum -c SOURCE-MANIFEST.sha256
          bash -n install.sh
          bash -n update.sh
          bash -n backup.sh
          bash -n uninstall.sh
          bash -n scripts/validate-source.sh
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find web scripts -type f -name '*.php' -print0)
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find web/assets -type f -name '*.js' -print0)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gateway/xlx_aprs_dprs.py')
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY
          python3 gateway/xlx_aprs_dprs.py --config config/config.example.json --check-config
          bash scripts/validate-source.sh

          git config user.name 'PU2PNY'
          git config user.email '47339656+PU2PNY@users.noreply.github.com'
          git add README.md CHANGELOG.md VERSION SOURCE-MANIFEST.sha256 install.sh config/config.example.json docs/ARCHITECTURE.md gateway/xlx_aprs_dprs.py systemd/xlx-aprs-dprs.service web
          git commit -m 'feat: make APRS-DPRS fully standalone and reflector-generic'
          git push origin HEAD:main
